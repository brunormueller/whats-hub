<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sheep</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #09090b;
        --card: #ffffff;
        --muted: #f4f4f5;
        --muted2: #fafafa;
        --mfg: #71717a;
        --bd: #e4e4e7;
        --pri: #18181b;
        --prifg: #fafafa;
        --acc: #10b981;
        --accsoft: #ecfdf5;
        --accfg: #047857;
        --warn: #f59e0b;
        --danger: #ef4444;
        --dangersoft: #fef2f2;
        --side: #fafafa;
        --shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --ring: rgba(24, 24, 27, 0.12);
      }
      html[data-theme="dark"] {
        --bg: #09090b;
        --fg: #fafafa;
        --card: #0e0e11;
        --muted: #27272a;
        --muted2: #18181b;
        --mfg: #a1a1aa;
        --bd: #27272a;
        --pri: #fafafa;
        --prifg: #18181b;
        --acc: #34d399;
        --accsoft: #04241c;
        --accfg: #6ee7b7;
        --warn: #fbbf24;
        --danger: #f87171;
        --dangersoft: #2a1416;
        --side: #0c0c0e;
        --shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
        --ring: rgba(250, 250, 250, 0.16);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          Geist,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--fg);
        text-decoration: none;
      }
      a:hover {
        color: var(--acc);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--bd);
        border-radius: 8px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      @keyframes dcpulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--mfg);
      }

      /* ---- mobile e tablet (até 960px) ----
         Estilo inline não enxerga media query: o que precisa mudar no celular
         é reescrito aqui, por classe, com !important. Acima de 960px nada
         disto vale e o desktop segue como estava. */
      .app-topbar,
      .app-backdrop {
        display: none;
      }
      @media (max-width: 960px) {
        html,
        body {
          -webkit-text-size-adjust: 100%;
          overflow-x: hidden;
        }
        /* 16px: abaixo disso o iOS dá zoom ao focar o campo */
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
        /* o switch tem 36x20; a área de toque cresce sem mudar o desenho */
        button[aria-pressed] {
          position: relative;
        }
        button[aria-pressed]::after {
          content: "";
          position: absolute;
          inset: -12px -6px;
        }

        .app-shell {
          min-width: 0 !important;
          min-height: 0 !important;
          height: 100vh !important;
          height: 100dvh !important;
          flex-direction: column;
          overflow: hidden;
        }
        .app-topbar {
          display: flex;
          flex: none;
          align-items: center;
          gap: 10px;
          padding: 6px 12px;
          padding-top: max(6px, env(safe-area-inset-top));
          border-bottom: 1px solid var(--bd);
          background: var(--bg);
        }
        .app-topbar button {
          width: 44px;
          height: 44px;
          display: grid;
          place-items: center;
          border: 1px solid var(--bd);
          border-radius: 9px;
          background: var(--card);
          cursor: pointer;
          font-size: 18px;
          line-height: 1;
        }
        .app-topbar span {
          font-size: 15px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        .app-sidebar {
          position: fixed !important;
          z-index: 60;
          top: 0;
          bottom: 0;
          left: 0;
          width: min(300px, 86vw) !important;
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          transform: translateX(-102%);
          visibility: hidden;
          transition:
            transform 0.2s,
            visibility 0s 0.2s;
          box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }
        .app-sidebar.is-open {
          transform: none;
          visibility: visible;
          transition-delay: 0s;
        }
        .app-sidebar nav button,
        .app-sidebar .side-foot > button {
          min-height: 44px;
        }
        .app-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 55;
          background: rgba(9, 9, 11, 0.5);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s;
        }
        .app-backdrop.is-open {
          opacity: 1;
          pointer-events: auto;
        }

        /* páginas do painel */
        .pg-headpad {
          padding: 14px 16px !important;
        }
        .ai-head {
          padding: 14px 16px 0 !important;
        }
        .pg-pad {
          padding: 16px 16px calc(32px + env(safe-area-inset-bottom)) !important;
        }
        .wrap-row {
          flex-wrap: wrap;
        }
        .wrap-row > :first-child {
          flex: 1 1 100% !important;
        }
        .pg-headpad h1 {
          font-size: 18px !important;
        }
        .pg-actions {
          flex-wrap: wrap;
        }
        .tap button:not([aria-pressed]) {
          min-height: 40px;
          height: auto !important;
        }
        .grid-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        .tabs-row {
          overflow-x: auto;
          flex-wrap: nowrap;
          scrollbar-width: none;
        }
        .tabs-row::-webkit-scrollbar {
          display: none;
        }
        .tabs-row button {
          flex: none;
          white-space: nowrap;
          min-height: 44px;
        }
        .ai-body {
          flex-direction: column;
          overflow: auto;
          -webkit-overflow-scrolling: touch;
        }
        .ai-main {
          flex: none !important;
          overflow: visible !important;
          padding: 16px 16px 24px !important;
        }
        .ai-sandbox {
          width: 100% !important;
          flex: none !important;
          border-left: 0 !important;
          border-top: 1px solid var(--bd);
          height: min(560px, 80vh);
          height: min(560px, 80dvh);
        }
        .row-wrap {
          flex-wrap: wrap;
        }
        .lead-row {
          grid-template-columns: auto minmax(0, 1fr) auto auto !important;
        }
        .lead-row > :nth-child(2) {
          grid-column: 2;
          grid-row: 1;
        }
        .lead-row > :nth-child(3) {
          grid-column: 2 / -1;
          grid-row: 2;
        }
        .lead-row > :nth-child(4) {
          grid-column: 3;
          grid-row: 1;
        }
        .lead-row > :nth-child(5) {
          grid-column: 4;
          grid-row: 1;
          padding: 10px 12px !important;
        }

        /* onboarding */
        .onb-pad {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
        .onb-grid {
          grid-template-columns: minmax(0, 1fr) !important;
          padding-top: 24px !important;
          padding-bottom: 40px !important;
        }
      }
      @media (max-width: 700px) {
        .grid-2 {
          grid-template-columns: minmax(0, 1fr) !important;
        }
      }
      @media (max-width: 600px) {
        .grid-3 {
          grid-template-columns: minmax(0, 1fr) !important;
        }
      }
      @media (max-width: 480px) {
        .grid-4 {
          grid-template-columns: minmax(0, 1fr) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
